name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Browser engine parity (JavaScript vs Python)
        run: |
          python -m runbookrag build
          python scripts/export_parity.py
          node --test frontend/tests/engine.test.mjs
      - name: Retrieval quality gate
        run: |
          python scripts/evaluate.py
          python -c "import json,sys; r=json.load(open('reports/evaluation.json'))['overall']['hybrid']; print(r); sys.exit(0 if r['recall@3']>=0.95 and r['mrr']>=0.90 else 1)"
      - name: Benchmark
        run: python scripts/benchmark.py
      - name: Build static demo and Lambda bundle
        run: |
          python scripts/build_demo.py
          bash scripts/package_lambda.sh
      - uses: actions/upload-artifact@v4
        with:
          name: demo-dist
          path: dist/

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t runbookrag:ci .
      - name: Smoke test container
        run: |
          docker run -d --name runbookrag -p 8000:8000 runbookrag:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS "http://127.0.0.1:8000/api/search?q=nginx+502&k=3" | python -c "import json,sys; d=json.load(sys.stdin); assert d['hits'][0]['doc']=='nginx-502-bad-gateway', d"
          curl -fsS -X POST http://127.0.0.1:8000/api/ask -H 'Content-Type: application/json' \
            -d '{"question":"container exits with code 137"}' | python -c "import json,sys; d=json.load(sys.stdin); assert d['answer'] and d['citations'], d"
          curl -fsS http://127.0.0.1:8000/ | grep -q RunbookRAG
          curl -fsS http://127.0.0.1:8000/evaluation.json > /dev/null
          docker logs runbookrag
          docker rm -f runbookrag
