[project]
name = "runbookrag"
version = "0.1.0"
description = "Hybrid retrieval and grounded, cited answers over operations runbooks"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jayanth Gonugunta Venkata" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["runbookrag", "api", "aws"]
